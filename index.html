<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Pedagogía Crítica</title>

<style>

body{

margin:0;
font-family:Arial;
background:linear-gradient(135deg,#4facfe,#43e97b);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;

}

#app{

width:95%;
max-width:750px;
background:white;
border-radius:25px;
padding:20px;
box-shadow:0px 10px 30px rgba(0,0,0,.3);
text-align:center;

}

h1{

color:#1565C0;

}

#escena{

font-size:70px;
margin:10px;

animation:flotar 2s infinite;

}

@keyframes flotar{

50%{transform:translateY(-5px);}

}

#barra{

height:25px;
background:#ddd;
border-radius:20px;
overflow:hidden;
margin-top:15px;

}

#progreso{

height:100%;
width:0%;
background:#4CAF50;
transition:.4s;

}

#autonomia{

font-size:22px;
margin:15px;

}

#pregunta{

font-size:22px;
margin:20px;

}

button{

width:100%;
padding:15px;
margin:10px 0;
border:none;
border-radius:15px;
font-size:18px;
cursor:pointer;
transition:.2s;

}

button:hover{

transform:scale(1.02);

}

#a{

background:#ef5350;
color:white;

}

#b{

background:#43a047;
color:white;

}

#mensaje{

font-size:22px;
font-weight:bold;
margin-top:15px;

}

</style>

</head>

<body>

<div id="app">

<div id="escena">

👩‍🏫👦👧📚

</div>

<h1>Construyendo una Educación Liberadora</h1>

<div id="autonomia">

💡 Autonomía: <span id="puntos">0</span>%

</div>

<div id="barra">

<div id="progreso"></div>

</div>

<div id="pregunta"></div>

<button id="a"></button>

<button id="b"></button>

<div id="mensaje"></div>

</div>

<script>

const preguntas=[

["El docente habla toda la clase.","Los estudiantes solo copian.","Los estudiantes dialogan y participan.","b"],

["Un niño hace una pregunta.","Ignorar la pregunta.","Responder fomentando la reflexión.","b"],

["Hay un problema en la comunidad.","Memorizar la teoría.","Buscar soluciones entre todos.","b"],

["Un alumno piensa diferente.","Callarlo.","Escuchar y debatir.","b"],

["Trabajo grupal.","Prohibir hablar.","Colaborar y construir ideas.","b"],

["El profesor siempre tiene la razón.","Nunca cuestionar.","Reflexionar y dialogar.","b"],

["Aprender significa...","Memorizar.","Comprender la realidad.","b"],

["La participación del estudiante...","No importa.","Es fundamental.","b"],

["La educación crítica busca...","Obediencia.","Transformar la sociedad.","b"],

["El aprendizaje debe ser...","Pasivo.","Activo y participativo.","b"]

];

let actual=0;
let autonomia=0;

mostrar();

function mostrar(){

pregunta.innerHTML="📖 "+preguntas[actual][0];

a.innerHTML="🔴 "+preguntas[actual][1];

b.innerHTML="🟢 "+preguntas[actual][2];

}

function responder(op){

if(op==preguntas[actual][3]){

autonomia+=10;

mensaje.innerHTML="✅ ¡Muy bien!";

}else{

mensaje.innerHTML="❌ Esa opción representa una educación tradicional.";

}

puntos.innerHTML=autonomia;

actual++;

progreso.style.width=(actual*10)+"%";

setTimeout(()=>{

mensaje.innerHTML="";

if(actual<preguntas.length){

mostrar();

}else{

fin();

}

},1200);

}

a.onclick=()=>responder("a");

b.onclick=()=>responder("b");

function fin(){

escena.innerHTML="🎓💡🌎🤝";

pregunta.innerHTML="<h2>¡Felicidades!</h2><p>Has comprendido que la Pedagogía Crítica promueve el diálogo, la reflexión, la participación y la autonomía del estudiante para transformar la realidad.</p>";

a.style.display="none";

b.style.display="none";

mensaje.innerHTML="🏆 Puntaje Final: "+autonomia+"%";

}

</script>

</body>

</html>
